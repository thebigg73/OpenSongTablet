apply plugin: 'com.android.application'
apply plugin: 'androidx.navigation.safeargs'

android {
    compileSdk 35
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        beta {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        resources.excludes.add("META-INF/*")
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId "com.garethevans.church.opensongtablet"
        minSdkVersion 19
        targetSdkVersion 35
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        versionCode 413
        versionName '6.4.1'
        /*externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                cppFlags ''
            }
        }*/
    }

    buildscript {
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath 'com.android.tools.build:gradle:4.2.2'
            classpath 'androidx.navigation:navigation-safe-args-gradle-plugin:2.8.8'
        }
    }

    repositories {
        google()
        mavenCentral()
        maven {
            url "https://jitpack.io"
        }
    }

    buildFeatures {
        viewBinding true
        prefab true
        buildConfig = true
    }

    namespace 'com.garethevans.church.opensongtablet'
    /*externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }*/
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'                    // To allow Java time/date utilities on <Android 8
    implementation 'androidx.activity:activity:1.10.1'                                  // Required for activity and permission requests
    implementation 'androidx.fragment:fragment:1.8.6'                                   // Using fragments and navigation
    implementation 'com.google.android.material:material:1.12.0'                        // Required for material design goodness
    implementation 'com.google.android.gms:play-services-cast:22.0.0'                   // For casting obviously!
    implementation 'com.google.android.gms:play-services-cast-framework:22.0.0'         // For casting obviously!
    implementation 'androidx.mediarouter:mediarouter:1.7.0'                             // For casting obviously!
    implementation 'com.google.android.gms:play-services-nearby:19.3.0'                 // For Google Nearby Connect devices
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1' // For OCR text recognition (PDF/Camera)
    implementation 'com.google.android.play:feature-delivery:2.1.0'                     // For updated resources
    implementation 'com.google.android.play:feature-delivery-ktx:2.1.0'                 // For updated resources
    //implementation 'com.google.android.play:asset-delivery:2.2.2'                       // For updated resources
    //implementation 'com.google.android.play:asset-delivery-ktx:2.2.2'                   // For updated resources
    //implementation 'com.google.android.play:review:2.0.1'                               // For updated resources
    //implementation 'com.google.android.play:review-ktx:2.0.1'                           // For updated resources
    implementation 'com.google.android.play:app-update:2.1.0'                           // For updated resources
    implementation 'com.google.android.play:review-ktx:2.0.2'
    // For updated resources
    implementation 'androidx.browser:browser:1.8.0'                                     // To open custom tab browser intents
    implementation 'androidx.recyclerview:recyclerview-selection:1.1.0'                 // RecyclerView (obviously)
    implementation 'androidx.recyclerview:recyclerview:1.4.0'                           // RecyclerView (obviously)
    implementation 'androidx.gridlayout:gridlayout:1.0.0'                               // GridLayout (obviously)
    implementation 'androidx.appcompat:appcompat:1.7.0'                                 // Allows access to app: features for older devices
    implementation 'androidx.cardview:cardview:1.0.0'                                   // Cardview for recycler list items
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'                   // Constraint layouts with FAB
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'                      // Lifecycle for fragment control
    implementation 'androidx.navigation:navigation-fragment:2.8.8'                      // The navigation fragment control
    implementation 'androidx.navigation:navigation-ui:2.8.8'                            // The navigation fragment control
    implementation 'androidx.navigation:navigation-dynamic-features-fragment:2.8.8'     // The navigation fragment control
    implementation 'androidx.preference:preference:1.2.1'                               // The app preferences
    implementation 'androidx.multidex:multidex:2.0.1'                                   // Allow splitting of file for older devices
    implementation 'androidx.annotation:annotation:1.9.1'                               // Allows annotations in code
    annotationProcessor 'androidx.annotation:annotation:1.9.1'                          // Allows annotations in code
    implementation 'androidx.core:core:1.15.0'
    implementation 'org.apache.commons:commons-compress:1.27.1'                         // For creating and editing compressed files (osb, backup)
    implementation files('libs/TarsosDSP-Android-2.4.jar')                              // For the pitch detection in the tuner
    implementation 'com.github.bumptech.glide:glide:4.16.0'                             // For better setting of images
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'                     // For better setting of images
    implementation 'com.github.deano2390:MaterialShowcaseView:1.3.7'                    // To highlight new features in the app
    implementation 'org.nanohttpd:nanohttpd:2.3.1'                                      // For a webserver to display songs for non OpenSongApp users
    implementation('com.vanniktech:android-image-cropper:4.6.0')                        // For image cropping/rotation
    implementation 'com.google.zxing:core:3.5.3'                                        // To generate QR code
    implementation 'com.caverock:androidsvg-aar:1.4'                                    // To convert SVG from abc notation into ImageView
    implementation 'com.gu.android:toolargetool:0.3.2'                                  // To attempt to log transaction too large crashes
    //implementation 'com.google.oboe:oboe:1.7.0'                                       // Low latency audio
    implementation 'androidx.exifinterface:exifinterface:1.4.0'                         // To get image exif data (orientation for camera)
    //noinspection GradleDependency - Updating this above 1.5.0 breaks it!!!
    implementation 'org.zwobble.mammoth:mammoth:1.5.0'  // Don't UPDATE                 // To extract text from docx files
    implementation 'com.google.code.gson:gson:2.11.0'                                   // GSon for JSON conversion of Song/Set objects
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    //debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.12'             // LeakCanary to help identify memory leaks

    // To include jar libraries
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Updates to material alpha and other dependencies using kotlin can cause errors
    // if they point to different libraries.
    /*constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }*/
}
