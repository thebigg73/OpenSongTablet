<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8"/>
    <title>OpenSongApp ABC Notation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--<script src="abcjs-basic-min.js" type="text/javascript"></script>-->
    <!-- Use a patched version that allows string decorations to identify strings such as [!s4!E !s2!c]   (1 = highest string) -->
    <script src="abcjs-basic-min.patched.js" type="text/javascript"></script>
    <script src="abcjs-string-marks.js" type="text/javascript"></script>
    <link rel="stylesheet" href="abcjs-audio.css" />
    <style>
        * {
            box-sizing: border-box;
        }
        :root {
            --main-color: #000000;
            --main-chord-color: #000000;
            --main-size-width: 1px;
            --main-font-size: 18pt;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            overflow-x: hidden;
        }

        /* Scoped to the score only, so the transport bar icons keep their own colours */
        #paper svg {
            fill: var(--main-color);
            stroke: var(--main-color);
        }

        .abcjs-chord {
            fill: var(--main-chord-color);
            stroke: var(--main-chord-color);
        }

        #warnings {
            font-size: var(--main-font-size);
        }

        #top {
            width: 100%;
            margin: 0 auto;
        }

        #paper {
            width: 100%;
            overflow-x: auto;
        }

        #abc {
            display: none;
            width: 100%;
            font-size: var(--main-font-size);
        }

        /* ---- Built-in abcjs transport bar, sitting under the score ----
           The stock abcjs-audio.css does the real work (flex row, progress track = flex:1).
           These rules only make it bigger / easier to hit on a phone.
           Selectors cover abcjs putting the class on #audio itself or on an inner div. */
        #audio {
            margin-top: 8px;
        }
        #audio.abcjs-inline-audio,
        #audio .abcjs-inline-audio {
            height: 44px;
            align-items: center;
        }
        #audio .abcjs-btn {
            width: 44px;
            height: 44px;
            padding: 8px;
            margin: 0;
        }
        #audio .abcjs-midi-progress-background {
            height: 12px;
            border-radius: 6px;
        }
        #audio .abcjs-midi-clock {
            font-size: 16px;
            width: 64px;
        }

        /* ---- Playback progress shown on the score ---- */
        :root {
            --play-color: #e53935;   /* change this to suit your popup theme */
        }
        #paper svg .abcjs-playing,
        #paper svg .abcjs-playing * {
            fill: var(--play-color) !important;
            stroke: var(--play-color) !important;
        }
        #paper svg .abcjs-cursor {
            stroke: var(--play-color) !important;
            stroke-width: 2px;
        }
    </style>
    <script type="text/javascript">
        var root = document.querySelector(':root');
        var whichView = -1;
        var s = "";
        var w = 720;
        var t = 0;
        var my_hideTab = false;
        var my_instrument = "guitar";
        var s6 = "E,";
        var s5 = "A,";
        var s4 = "D";
        var s3 = "G";
        var s2 = "B";
        var s1 = "e";
        var strings_6 = true;
        var strings_5 = false;
        var strings_4 = false;
        var my_label = "Guitar";
        var maincolor = "#FFFFFF";
        var chordcolor = "#FFFFFF";
        var resp = "resize";
        var defaultoptions = {};
        var midioptions = {};
        var reported = false;
        var padding = 4;
        var isPopup = false;

        // ---- Tap a note on the score: sound it, and move playback to that point ----
        var noteInfo = {};            // ABC text position (startChar) -> { ms, midiPitches }
        var noteInfoFor = null;       // the tune the map was built for

        // Height (CSS px) reserved under the score for the transport bar (44px bar + 8px margin + a little slack).
        // Added to the height reported back to Android in popup mode.
        var AUDIO_BAR_HEIGHT = 56;

        // Whether the transport bar is wanted at all (set from Android via setShowTransport)
        var showTransport = true;

        var visualObj = null;
        var synthControl = null;
        var audioContext = null;
        var lastAudioTune = null;

        const SOUNDFONT_URL = "https://paulrosen.github.io/midi-js-soundfonts/FluidR3_GM/";

        function preloadSoundFont() {
            if (!showTransport) return;
            if (ABCJS.synth && ABCJS.synth.supportsAudio()) {
                try {
                    var createSynth = new ABCJS.synth.CreateSynth();
                    createSynth.init({
                        soundFontUrl: SOUNDFONT_URL,
                        options: { soundFontVolumeMultiplier: 1.0 }
                    });
                } catch (e) {
                    console.warn("SoundFont preload error:", e);
                }
            }
        }

        function clearPlayingHighlight() {
            var last = document.querySelectorAll("#paper svg .abcjs-playing");
            for (var k = 0; k < last.length; k++) {
                last[k].classList.remove("abcjs-playing");
            }
        }

        // abcjs calls these while the transport bar plays the tune.
        // Draws a cursor line and highlights the notes currently sounding.
        var cursorControl = {
            beatSubdivisions: 2,
            onReady: function() {},
            onStart: function() {
                var svg = document.querySelector("#paper svg");
                if (!svg) return;
                var old = svg.querySelector(".abcjs-cursor");
                if (old) old.remove();
                var cursor = document.createElementNS("http://www.w3.org/2000/svg", "line");
                cursor.setAttribute("class", "abcjs-cursor");
                cursor.setAttribute("x1", 0);
                cursor.setAttribute("x2", 0);
                cursor.setAttribute("y1", 0);
                cursor.setAttribute("y2", 0);
                svg.appendChild(cursor);
            },
            onBeat: function(beatNumber, totalBeats, totalTime) {},
            onEvent: function(ev) {
                // Second half of a tie across a bar line: nothing new to show
                if (ev.measureStart && ev.left === null) return;

                clearPlayingHighlight();
                if (ev.elements) {
                    for (var i = 0; i < ev.elements.length; i++) {
                        var group = ev.elements[i];
                        for (var j = 0; j < group.length; j++) {
                            group[j].classList.add("abcjs-playing");
                        }
                    }
                }

                var cursor = document.querySelector("#paper svg .abcjs-cursor");
                if (cursor) {
                    cursor.setAttribute("x1", ev.left - 2);
                    cursor.setAttribute("x2", ev.left - 2);
                    cursor.setAttribute("y1", ev.top);
                    cursor.setAttribute("y2", ev.top + ev.height);

                    // Keep the line being played in view (harmless if the page isn't scrollable)
                    try {
                        var r = cursor.getBoundingClientRect();
                        if (r.top < 0 || r.bottom > window.innerHeight - AUDIO_BAR_HEIGHT) {
                            window.scrollBy({ top: r.top - 40, behavior: "smooth" });
                        }
                    } catch (e) {}
                }
            },
            onFinished: function() {
                clearPlayingHighlight();
                var cursor = document.querySelector("#paper svg .abcjs-cursor");
                if (cursor) {
                    cursor.setAttribute("x1", 0);
                    cursor.setAttribute("x2", 0);
                    cursor.setAttribute("y1", 0);
                    cursor.setAttribute("y2", 0);
                }
            }
        };

        function updateABC(s) {
            var unencoded = decodeURIComponent(s);
            unencoded = unencoded.replaceAll("&apos;","'");
            unencoded = unencoded.replaceAll("__NEWLINE__","\n");
            if (document.getElementById("abc")!=null) {
                document.getElementById("abc").innerHTML = unencoded;
                initEditor();
            }
        }

        function selectionCallback(abcelem) {
            var note = {};
            for (var key in abcelem) {
                if (abcelem.hasOwnProperty(key) && key !== "abselem") {
                    note[key] = abcelem[key];
                }
            }
        }

        function setMainColor(col) { maincolor = col; document.documentElement.style.setProperty('--main-color', col); }
        function setChordColor(col) { chordcolor = col; document.documentElement.style.setProperty('--main-chord-color', col); }
        function setResponsive(responsive) { resp = responsive; }
        function setTranspose(halfSteps) { t = halfSteps; }
        function setHideTab(hideTab) { my_hideTab = hideTab; }
        function setInstrument(tabInstrument) { my_instrument = tabInstrument; }
        function setTuning(s6_in, s5_in, s4_in, s3_in, s2_in, s1_in) {
            s6 = s6_in; s5 = s5_in; s4 = s4_in; s3 = s3_in; s2 = s2_in; s1 = s1_in;
            if (s6.length===0 && s5.length===0) { strings_6 = false; strings_5 = false; strings_4 = true; }
            else if (s6.length===0) { strings_6 = false; strings_5 = true; strings_4 = false; }
            else { strings_6 = true; strings_5 = false; strings_4 = false; }
        }
        function setLabel(tabLabel) { my_label = tabLabel; }
        function setIsPopup(p) { isPopup = p; }

        // Show or hide the transport bar. Call with true to show it, false to hide it.
        // Best called before updateABC() so the reported height is right; it also works later.
        function setShowTransport(show) {
            showTransport = (show === true || show === "true");
            var audioDiv = document.getElementById("audio");
            if (!showTransport) {
                // Stop playback, remove the cursor/highlight and hide the bar
                try { if (synthControl) synthControl.pause(); } catch (e) {}
                clearPlayingHighlight();
                var cursor = document.querySelector("#paper svg .abcjs-cursor");
                if (cursor) cursor.remove();
                if (audioDiv) audioDiv.style.display = "none";
            } else if (isPopup && visualObj) {
                // Shown again after the score was already rendered
                renderAudioController(visualObj);
            }
        }
        function setWidth(wd) { w = wd; document.getElementById("top").style.width = wd+"px"; document.getElementById("abc").style.width = wd+"px"; document.documentElement.style.setProperty('--main-size-width', wd+"px"); }
        function setWebView(whichWebView) { whichView = whichWebView; }

        function displayOnly() {
            var b = document.getElementById("bottom");
            if (b) b.style.display = "none";
            var w_el = document.getElementById("warnings");
            if (w_el) w_el.style.display = "none";
            var a_el = document.getElementById("abc");
            if (a_el) a_el.style.display = "none";
        }

        function displayAndEdit() {
            var b = document.getElementById("bottom");
            if (b) b.style.display = "block";
            var w_el = document.getElementById("warnings");
            if (w_el) w_el.style.display = "block";
            var a_el = document.getElementById("abc");
            if (a_el) a_el.style.display = "none";
        }

        var ro = new ResizeObserver( entries => {
            for (let entry of entries) {
                var width = entry.contentRect.width;
                var height = entry.contentRect.height;
                if (height>1 && !reported) {
                    reported = true;
                    // In popup mode the transport bar sits under the score, so leave room for it
                    var extra = (isPopup && showTransport) ? AUDIO_BAR_HEIGHT : 0;
                    if (window.AndroidApp && window.AndroidApp.returnSize) {
                        AndroidApp.returnSize(whichView, width, height + padding + extra, document.getElementById("paper").innerHTML, isPopup);
                    }
                }
            }
        });

        function getMyScrollHeight() {
            reported = false;
            ro.observe(document.getElementById('paper'));
        }

        function updateOptions() {
            defaultoptions = {paddingtop:0, paddingbottom:padding, paddingright:0, paddingleft:0,
                                    staffwidth: w, add_classes:true, responsive: 'resize',
                                    afterParsing: window.abcStringMarksAfterParsing,
                                    clickListener: scoreClickListener,
                                    selectTypes: ["note"],
                                    foregroundColor: maincolor,
                                    viewportHorizontal: true, viewportVertical: true,
                                    scrollHorizontal:false, scrollVertical:false,
                                    visualTranspose: t,
                                    format:{tablabelfont: "Arial 10", gchordfont: "Arial 12"}};
            midioptions = {generate_midi: false, midi_id:"midi", midi_download_id: "midi-download",
                    generate_warnings: true, warnings_id:"warnings",
                    midi_options: {generateDownload: false},
                    render_options: {listener: {highlight: selectionCallback}}};
        }

        // Builds abcjs's built-in transport bar in #audio (popup only).
        // Safe to call repeatedly: the controller is created once, and the tune is only
        // re-set when it actually changes.
        function renderAudioController(tune) {
            var audioDiv = document.getElementById("audio");
            if (!audioDiv) return;

            // Only the popup gets a player; keep it hidden in the editor / inline views
            if (!isPopup || !showTransport || !ABCJS.synth || !ABCJS.synth.supportsAudio() || !tune) {
                audioDiv.style.display = "none";
                return;
            }

            // Remove the inline display:none so abcjs's own stylesheet (display:flex) takes over
            audioDiv.style.display = "";

            try {
                if (!audioContext) {
                    var AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    audioContext = new AudioContextClass();
                }

                if (!synthControl) {
                    synthControl = new ABCJS.synth.SynthController();
                    synthControl.load("#audio", cursorControl, {
                        displayRestart: true,
                        displayPlay: true,
                        displayProgress: true,
                        displayLoop: false,
                        displayWarp: false,
                        displayClock: true
                    });
                }

                if (tune === lastAudioTune) return;
                lastAudioTune = tune;

                synthControl.setTune(tune, false, {
                    audioContext: audioContext,
                    soundFontUrl: SOUNDFONT_URL
                }).catch(function(error) {
                    console.warn("Audio Synth Warning: ", error);
                });
            } catch (err) {
                console.warn("Failed to initialize audio synth: ", err);
            }
        }

        function initEditor() {
            updateOptions();
            getMyScrollHeight();

            var editor;
            var myoptions = defaultoptions;
            if (my_hideTab !== true) {
                var taboptions = strings_6 === true ?
                    {tablature: [{instrument: my_instrument, label: my_label, tuning: [s6,s5,s4,s3,s2,s1]}]} :
                    strings_5 === true ?
                    {tablature: [{instrument: my_instrument, label: my_label, tuning: [s5,s4,s3,s2,s1]}]} :
                    {tablature: [{instrument: my_instrument, label: my_label, tuning: [s4,s3,s2,s1]}]};
                myoptions = {...defaultoptions, ...taboptions};
            }

            // ---- Equalise rows: probe the natural width, then render at that width ----
            // If one row is wider than the staff width, the other rows were only stretched
            // to staffwidth. Render once to measure, then use the widest row as the staff width.
            try {
                ABCJS.renderAbc("paper", document.getElementById("abc").value, myoptions);
                var svg0 = document.querySelector('#paper svg');
                var vb = svg0 && svg0.getAttribute('viewBox');
                if (vb) {
                    var natural = parseFloat(vb.split(/[ ,]+/)[2]);
                    if (natural > w + 2) {
                        myoptions = {...myoptions, staffwidth: Math.ceil(natural)};
                    }
                }
            } catch (e) {
                console.warn("Row-width probe failed:", e);
            }

            editor = new ABCJS.Editor("abc", {
                paper_id: "paper",
                warnings_id: "warnings",
                abcjsParams: myoptions,
                midioptions,
                onchange: function(res) {
                    if (res && res.tunes && res.tunes[0]) {
                        visualObj = res.tunes[0];
                        renderAudioController(visualObj);
                    }
                }
            });

            setTimeout(function() {
                if (editor && editor.tunes && editor.tunes[0]) {
                    visualObj = editor.tunes[0];
                    renderAudioController(visualObj);
                }
            }, 200);
        }

        function buildNoteInfo(tune) {
            noteInfo = {};
            noteInfoFor = tune;
            try {
                tune.setUpAudio({});    // fills in each note's midiPitches (empty until the player has loaded)
                var tc = new ABCJS.TimingCallbacks(tune, {});
                tc.noteTimings.forEach(function(ev) {
                    if (!ev || ev.type !== "event") return;
                    var chars = ev.startCharArray || [ev.startChar];
                    chars.forEach(function(sc) {
                        // First occurrence wins (a repeated section keeps its first pass)
                        if (sc !== undefined && sc !== null && noteInfo[sc] === undefined) {
                            noteInfo[sc] = { ms: ev.milliseconds, midiPitches: ev.midiPitches };
                        }
                    });
                });
            } catch (e) {
                console.warn("Note timing map failed:", e);
            }
        }

        function scoreClickListener(abcelem, tuneNumber, classes, analysis, drag, mouseEvent) {
            if (!isPopup || !showTransport || !visualObj || !abcelem) return;
            if (noteInfoFor !== visualObj) buildNoteInfo(visualObj);
            var info = noteInfo[abcelem.startChar];
            if (!info) return;                                   // bar line, title, etc.

            var playing = !!(synthControl && synthControl.isStarted);

            // 1. Sound the tapped note(s), unless the tune is already playing
            if (!playing && info.midiPitches && info.midiPitches.length &&
                    ABCJS.synth && ABCJS.synth.supportsAudio()) {
               try {
                    // This build's signature: (pitches, graceNotes, millisecondsPerMeasure, soundFontUrl)
                    var p = ABCJS.synth.playEvent(info.midiPitches, abcelem.midiGraceNotes,
                            visualObj.millisecondsPerMeasure(), SOUNDFONT_URL);
                    if (p && p.catch) p.catch(function(e) { console.warn("Note preview:", e); });
                } catch (e) {
                    console.warn("Note preview failed:", e);
                }
            }

            // 2. Move the playback position (loads the player first if it has not been started yet)
            if (synthControl && synthControl.runWhenReady) {
                synthControl.runWhenReady(function() {
                    synthControl.seek(info.ms / 1000, "seconds");
                    // The player only refreshes its progress bar and its stored position when the beat
                    // changes, so set them explicitly (otherwise Play restarts from the previous beat)
                    var tm = synthControl.timer;
                    if (tm && tm.lastMoment) {
                        synthControl.setProgress(Math.min(1, info.ms / tm.lastMoment), tm.lastMoment);
                    }
                }, undefined);
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            preloadSoundFont();
        });
    </script>
</head>
<body>
<div id="top">
    <div id="paper"></div>
    <!-- abcjs builds its transport bar in here; hidden until the popup needs it -->
    <div id="audio" style="display:none"></div>
    <div id="warnings" style="color:#ffffff; background-color:#ff0000; display:none;"></div>
</div>

<div id="bottom" style="display:none">
    <textarea id="abc" name="abc" rows="16"></textarea>
</div>
</body>
</html>
